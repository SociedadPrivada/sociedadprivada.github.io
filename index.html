<style>
  :root {
    --bg: #12100e;
    --bg-2: #1b1714;
    --line: rgba(201, 165, 90, .22);
    --gold: #cfae62;
    --gold-soft: #e6d19a;
    --fire: #e8912a;
    --text: #efe6d6;
    --muted: #a89c88;
    --serif: "Cormorant Garamond", Georgia, "Times New Roman", serif;
    --display: "Cinzel", Georgia, serif;
    --sans: "Jost", system-ui, -apple-system, "Segoe UI", sans-serif;
  }
  * { box-sizing: border-box; }
  html { scroll-behavior: smooth; -webkit-text-size-adjust: 100%; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font-family: var(--serif); font-size: 19px; line-height: 1.35;
    background-image: radial-gradient(ellipse 120% 50% at 50% -10%, rgba(232,145,42,.13), transparent 60%);
    background-repeat: no-repeat;
  }
  .wrap { max-width: 680px; margin: 0 auto; padding: 0 18px; }

  header.hero { text-align: center; padding: 34px 0 18px; }
  header.hero img { width: min(78%, 360px); height: auto; display: block; margin: 0 auto; }
  header.hero .tag {
    font-family: var(--sans); font-size: 11px; letter-spacing: .32em; text-transform: uppercase;
    color: var(--muted); margin-top: 18px;
  }

  nav.cats {
    position: sticky; top: 0; z-index: 10;
    background: rgba(18,16,14,.94); backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
    border-bottom: 1px solid var(--line);
  }
  nav.cats .scroller {
    display: flex; gap: 6px; overflow-x: auto; padding: 10px 18px; max-width: 680px; margin: 0 auto;
    scrollbar-width: none;
  }
  nav.cats .scroller::-webkit-scrollbar { display: none; }
  nav.cats a {
    flex: 0 0 auto; text-decoration: none; color: var(--muted);
    font-family: var(--sans); font-size: 12.5px; letter-spacing: .14em; text-transform: uppercase;
    padding: 8px 13px; border-radius: 999px; border: 1px solid transparent; transition: .2s;
  }
  nav.cats a.active { color: var(--bg); background: var(--gold); }

  .search { padding: 16px 0 4px; }
  .search input {
    width: 100%; background: var(--bg-2); color: var(--text);
    border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px;
    font-family: var(--sans); font-size: 16px; outline: none;
  }
  .search input::placeholder { color: #7d7262; }
  .search input:focus { border-color: var(--gold); }

  section.cat { padding-top: 30px; scroll-margin-top: 58px; }
  h2 {
    font-family: var(--display); font-weight: 600; color: var(--gold);
    font-size: 25px; letter-spacing: .12em; text-transform: uppercase;
    text-align: center; margin: 0 0 4px;
  }
  .flame { display: block; text-align: center; color: var(--fire); font-size: 13px; letter-spacing: .5em; margin-bottom: 8px; }
  .cat-note { text-align: center; font-style: italic; color: var(--muted); margin: 0 0 6px; font-size: 17px; }
  h3 {
    font-family: var(--sans); font-weight: 500; font-size: 12.5px; letter-spacing: .26em; text-transform: uppercase;
    color: var(--fire); margin: 24px 0 4px; display: flex; align-items: center; gap: 12px;
  }
  h3::after { content: ""; flex: 1; height: 1px; background: var(--line); }

  .item { padding: 11px 0; border-bottom: 1px dashed rgba(201,165,90,.12); }
  .item:last-child { border-bottom: 0; }
  .row { display: flex; align-items: baseline; gap: 10px; }
  .name { font-size: 20px; font-weight: 600; color: var(--text); min-width: 0; overflow-wrap: anywhere; font-variant-numeric: lining-nums; }
  .dots { flex: 1; border-bottom: 1px dotted rgba(201,165,90,.35); transform: translateY(-5px); min-width: 16px; }
  .price { font-family: var(--sans); font-size: 15.5px; font-weight: 500; color: var(--gold-soft); white-space: nowrap; font-variant-numeric: tabular-nums; }
  .price.soft { color: var(--muted); font-weight: 400; font-style: normal; }
  .desc { color: var(--muted); font-style: italic; font-size: 17px; margin-top: 2px; }

  .empty { text-align: center; color: var(--muted); font-style: italic; padding: 40px 0; display: none; }

  footer {
    text-align: center; color: var(--muted); padding: 44px 0 56px; margin-top: 30px;
    border-top: 1px solid var(--line); font-size: 16px;
  }
  footer .cubierto { font-family: var(--sans); font-size: 13px; letter-spacing: .18em; text-transform: uppercase; color: var(--gold); }
  footer small { display: block; margin-top: 10px; font-family: var(--sans); font-size: 12px; opacity: .7; }

  /* Versión impresa: fondo claro, A4, dos columnas */
  @page { size: A4; margin: 14mm 13mm; }
  @media print {
    :root { --bg: #fff; --text: #1f1a14; --muted: #6f6556; --gold: #a88434; --gold-soft: #1f1a14; --fire: #c8741a; --line: rgba(168,132,52,.35); }
    body { background: #fff; font-size: 13.5px; line-height: 1.25; }
    nav.cats, .search, .empty { display: none !important; }
    .wrap { max-width: none; padding: 0; }
    header.hero { padding: 6mm 0 2mm; }
    header.hero img { width: 62mm; }
    header.hero .tag { margin-top: 3mm; }
    main.wrap { columns: 2; column-gap: 11mm; }
    section.cat { padding-top: 6mm; break-inside: auto; }
    section.cat#vinos, section.cat#tragos { break-before: column; }
    .flame { display: none; }
    h2 { font-size: 16px; margin-bottom: 1mm; break-after: avoid; }
    h3 { font-size: 9px; margin: 3.5mm 0 1mm; break-after: avoid; }
    .item { padding: 1.3mm 0; break-inside: avoid; border-bottom-color: rgba(168,132,52,.18); }
    .name { font-size: 13.5px; }
    .price { font-size: 10.5px; }
    .dots { transform: translateY(-3px); }
    .desc { font-size: 11.5px; margin-top: 0; }
    footer { padding: 5mm 0 0; margin-top: 10mm; break-inside: avoid; font-size: 11px; }
    footer .cubierto { font-size: 9.5px; }
    footer small { font-size: 9px; }
  }
</style>
</head>

  }
  if (id !== current) { current = id; setActive(id); }
}
addEventListener("scroll", onScroll, { passive: true });
onScroll();

// Búsqueda
const q = document.getElementById("q");
const empty = document.getElementById("empty");
q.addEventListener("input", () => {
  const term = norm(q.value.trim());
  let any = false;
  document.querySelectorAll("section.cat").forEach(sec => {
    let secHas = false;
    sec.querySelectorAll(".group").forEach(g => {
      let gHas = false;
      g.querySelectorAll(".item").forEach(it => {
        const show = !term || it.dataset.q.includes(term);
        it.style.display = show ? "" : "none";
        if (show) gHas = true;
      });
      g.style.display = gHas ? "" : "none";
      if (gHas) secHas = true;
    });
    sec.style.display = secHas ? "" : "none";
    if (secHas) any = true;
  });
  empty.style.display = any ? "none" : "block";
});
</script>
